<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b1d" />
      <stop offset="42%" stop-color="#141a42" />
      <stop offset="76%" stop-color="#2c2680" />
      <stop offset="100%" stop-color="#4a3fd6" />
    </linearGradient>
    <radialGradient id="novaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="18%" stop-color="#bcd0ff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#6d8bff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6d8bff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eef1ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#eef1ff" stop-opacity="0.55" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34" />
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#base)" />

  <!-- soft ambient glows -->
  <circle cx="220" cy="480" r="230" fill="url(#glowPurple)" filter="url(#soft)" />
  <circle cx="760" cy="70" r="190" fill="url(#glowTeal)" filter="url(#soft)" />

  <!-- faint grid, evokes a circuit / dashboard backdrop -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600 M0 400 H1600 M0 500 H1600" />
    <path d="M100 0 V600 M300 0 V600 M500 0 V600 M700 0 V600 M900 0 V600 M1100 0 V600 M1300 0 V600 M1500 0 V600" />
  </g>

  <!-- circuit traces converging toward the "nova" burst on the right -->
  <g stroke="#a9bcff" stroke-opacity="0.32" stroke-width="1.4" fill="none">
    <path d="M0 460 L220 400 L420 440 L620 340 L840 380 L1040 300 L1230 320" />
    <path d="M220 400 L240 240 M420 440 L470 560 M620 340 L600 170 M840 380 L900 500 M1040 300 L1000 150" />
    <path d="M0 130 L180 160 L360 110 L560 170 L760 120 L940 190" />
  </g>
  <g fill="#eef1fb">
    <circle cx="220" cy="400" r="5" fill-opacity="0.85" />
    <circle cx="240" cy="240" r="3.5" fill-opacity="0.65" />
    <circle cx="420" cy="440" r="4" fill-opacity="0.8" />
    <circle cx="470" cy="560" r="3" fill-opacity="0.55" />
    <circle cx="620" cy="340" r="5" fill-opacity="0.9" />
    <circle cx="600" cy="170" r="3.5" fill-opacity="0.65" />
    <circle cx="840" cy="380" r="4.5" fill-opacity="0.85" />
    <circle cx="1040" cy="300" r="5" fill-opacity="0.9" />
    <circle cx="180" cy="160" r="3" fill-opacity="0.55" />
    <circle cx="360" cy="110" r="3.5" fill-opacity="0.65" />
    <circle cx="560" cy="170" r="3" fill-opacity="0.55" />
    <circle cx="760" cy="120" r="4" fill-opacity="0.75" />
    <circle cx="940" cy="190" r="3.5" fill-opacity="0.65" />
  </g>

  <!-- the "Nova": a bright bursting star anchoring the brand name, upper right -->
  <g transform="translate(1310,190)">
    <circle r="230" fill="url(#novaCore)" filter="url(#softer)" />
    <g stroke="url(#rayGrad)" stroke-width="2.5" stroke-linecap="round">
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(0)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(30)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(60)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(90)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(120)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(150)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(180)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(210)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(240)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(270)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(300)" />
      <line x1="-260" y1="0" x2="-40" y2="0" transform="rotate(330)" />
    </g>
    <circle r="150" fill="none" stroke="#c8d3ff" stroke-opacity="0.3" stroke-width="1" />
    <circle r="95" fill="none" stroke="#eef1ff" stroke-opacity="0.4" stroke-width="1" />
    <g fill="#ffffff">
      <circle cx="0" cy="0" r="16" />
      <path d="M0 -16 L4.6 -4.6 L16 0 L4.6 4.6 L0 16 L-4.6 4.6 L-16 0 L-4.6 -4.6 Z" fill="#ffffff" />
    </g>
    <circle cx="-170" cy="-70" r="3" fill="#eef1ff" fill-opacity="0.8" />
    <circle cx="150" cy="-120" r="2.5" fill="#eef1ff" fill-opacity="0.7" />
    <circle cx="200" cy="80" r="3.5" fill="#eef1ff" fill-opacity="0.8" />
    <circle cx="-120" cy="140" r="2.5" fill="#eef1ff" fill-opacity="0.7" />
  </g>

  <!-- hexagon accents echoing a "tech" motif, bottom-right -->
  <g stroke="#7c5cf6" stroke-opacity="0.4" stroke-width="1.6" fill="none">
    <polygon points="1470,470 1500,488 1500,524 1470,542 1440,524 1440,488" />
    <polygon points="1520,400 1550,418 1550,454 1520,472 1490,454 1490,418" />
  </g>
</svg>
